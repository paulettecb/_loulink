[build]
  command = "npm run build"
  publish = "dist"

# Pretty URL for the standalone quote page
[[redirects]]
  from = "/cotizacion"
  to = "/cotizacion.html"
  status = 200

# SPA fallback — React Router handles the paths client-side
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
